<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wohnzimmer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1eef6;--surf:#fff;--ink:#1d1a2b;--mute:#6f6a85;--line:#ddd7ea;--tube:#e4dfef;--h:30;--s:100%;--on:1;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131f;--surf:#201d2e;--ink:#f1eefb;--mute:#9a95b3;--line:#383350;--tube:#0d0b14;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15131f;--surf:#201d2e;--ink:#f1eefb;--mute:#9a95b3;--line:#383350;--tube:#0d0b14;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background-color:var(--bg);transition:background-color .3s}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
.pill{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.pill[data-state="busy"] i{background:#e8a317;animation:blink .8s infinite}
.pill[data-state="on"] i{background:#2fb86b}
@keyframes blink{50%{opacity:.25}}
.hero{padding:44px 20px 26px}
.tube{display:flex;gap:5px;padding:12px;border-radius:999px;background:var(--tube);box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.tube span{flex:1;aspect-ratio:1;border-radius:50%;background:#3a3552}
.status{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.status b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.status small{font-size:15px;color:var(--mute)}
.power{width:64px;height:64px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:var(--surf);color:var(--mute);box-shadow:0 0 0 2px var(--line)}
.power[aria-pressed="true"]{background:hsl(var(--h) var(--s) 55%);color:#14121c;box-shadow:0 0 28px hsl(var(--h) var(--s) 55%/.65)}
.power svg{width:28px;height:28px}
.sheet{flex:1;background:var(--surf);border-radius:28px 28px 0 0;padding:24px 20px 32px;box-shadow:0 -1px 0 var(--line)}
.sec{margin-bottom:26px;transition:opacity .2s}
.sec.dim{opacity:.38;pointer-events:none}
.sec h2{font-size:16px;font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between}
.sec h2 span{color:var(--mute);font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:7px;background:var(--track)}
input[type=range]::-moz-range-track{height:14px;border-radius:7px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-7px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.45)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.45)}
#hue{--track:linear-gradient(90deg,hsl(0 100% 55%),hsl(60 100% 55%),hsl(120 100% 55%),hsl(180 100% 55%),hsl(240 100% 55%),hsl(300 100% 55%),hsl(360 100% 55%))}
#bri{--track:linear-gradient(90deg,hsl(var(--h) var(--s) 8%),hsl(var(--h) var(--s) 58%))}
#spd{--track:linear-gradient(90deg,var(--line),var(--mute))}
.sw{display:flex;gap:10px;margin-top:10px;overflow-x:auto;padding:4px 2px}
.sw button{flex:0 0 36px;height:36px;border-radius:50%;border:0;cursor:pointer;background:var(--c);box-shadow:0 0 0 2px var(--surf),0 0 0 3.5px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surf),0 0 0 4px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font:inherit;font-size:15px;font-weight:600;padding:10px 16px;border-radius:14px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:hsl(var(--h) var(--s) 55%);border-color:transparent;color:#14121c}
#msg{margin:14px 20px 0;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surf);font-size:14px;line-height:1.4}
#msg:empty{display:none}
button:focus-visible,input:focus-visible{outline:3px solid hsl(var(--h) var(--s) 55%);outline-offset:2px}

[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.pg{flex:1;display:flex;flex-direction:column;background-image:radial-gradient(110% 55% at 50% 0%,hsl(var(--h) var(--s) 55%/calc(var(--on)*.3)),transparent 70%);background-repeat:no-repeat}
#g-heizung{--h:16;--s:85%;--on:1}#g-musik{--h:262;--s:80%;--on:1}#g-beschattung{--h:205;--s:70%;--on:1}#g-lueftung{--h:168;--s:60%;--on:1}
.tag{font-size:13px;font-weight:600;color:var(--mute);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surf)}
.sub{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:12px 10px 8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.menu button{display:flex;flex-direction:column;align-items:center;gap:5px;font:inherit;font-size:10.5px;font-weight:600;color:var(--mute);background:transparent;border:1.5px solid transparent;border-radius:16px;padding:9px 0 8px;cursor:pointer}
.menu svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu button[aria-current="true"]{color:var(--ink);background:var(--surf);border-color:var(--ac)}
.menu button[aria-current="true"] svg{stroke:var(--ac)}
.hero{padding:26px 20px 22px}
.hero .status{margin-top:18px}
.gz{display:block;width:100%;max-width:320px;margin:0 auto}
.power svg,.ib svg{width:26px;height:26px}
.rg{--track:linear-gradient(90deg,var(--line),hsl(var(--h) var(--s) 55%))}
.kt{--track:linear-gradient(90deg,#ffb35c,#fff4e0,#cfe3ff)}
.tg{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.tg small{display:block;font-weight:400;color:var(--mute);font-size:13.5px}
.tg button{position:relative;flex:0 0 52px;height:30px;border-radius:15px;border:0;background:var(--line);cursor:pointer}
.tg button::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .2s}
.tg button[aria-checked="true"]{background:hsl(var(--h) var(--s) 55%)}
.tg button[aria-checked="true"]::after{transform:translateX(22px)}
.tm{display:flex;gap:10px}
.tm label{flex:1;font-size:13.5px;color:var(--mute)}
.tm input{width:100%;margin-top:4px;font:inherit;font-size:16px;padding:9px 10px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:hsl(var(--h) var(--s) 55%)}
.np{display:flex;gap:16px;align-items:center}
.np b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.np small,.tm2 small{color:var(--mute);font-size:14.5px}
.np+.bar{margin-top:20px}.tm2{margin-top:6px}
.art{flex:0 0 92px;height:92px;border-radius:22px;background:linear-gradient(135deg,hsl(262 80% 62%),hsl(315 75% 58%));display:flex;align-items:flex-end;justify-content:center;gap:6px;padding:20px 0}
.art i{width:8px;height:100%;background:#fff;border-radius:3px;transform-origin:bottom;animation:eq .8s ease-in-out infinite alternate}
.art i:nth-child(2){animation-delay:-.3s}.art i:nth-child(3){animation-delay:-.6s}.art i:nth-child(4){animation-delay:-.15s}
.art[data-p] i{animation:none;transform:scaleY(.2)}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.tr{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:18px}
.ib{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.foot{margin:0;padding:14px 20px 30px;font-size:13px;color:var(--mute);background:var(--surf)}
.hint{margin:6px 0 0;font-size:14px;line-height:1.45;color:var(--mute)}
.hint.err{color:#e5584f;font-weight:600}
.uri{display:block;margin-top:8px;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--line);font-size:13px;word-break:break-all;user-select:all}
.power:disabled,.ib:disabled{opacity:.4;cursor:default;box-shadow:none}
.art.img{background-size:cover;background-position:center;padding:0}
.np b{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
<header><h1>Wohnzimmer</h1><span class="tag">Außen 14 °C · Demo</span></header>
<nav class="menu" id="menu" aria-label="Bereiche"></nav>
<section class="pg" id="g-licht">
  <header>
    <h2 class="sub">Lichtband</h2>
    <button class="pill" id="conn" data-state="off"><i></i><span>Verbinden</span></button>
  </header>
  <p id="msg" role="status"></p>

  <section class="hero">
    <div class="tube" id="tube" aria-hidden="true"></div>
    <div class="status">
      <div><b id="fx-name">Statisch</b><small id="fx-sub">Warmes Orange · 70 %</small></div>
      <button class="power" id="power" aria-pressed="true" aria-label="Ein/Aus">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      </button>
    </div>
  </section>

  <main class="sheet">
    <div class="sec" id="sec-color">
      <h2>Farbe</h2>
      <input type="range" id="hue" min="0" max="360" value="30" aria-label="Farbton">
      <div class="sw" id="sw"></div>
    </div>
    <div class="sec">
      <h2>Helligkeit <span id="bri-v">70 %</span></h2>
      <input type="range" id="bri" min="5" max="100" value="70" aria-label="Helligkeit">
    </div>
    <div class="sec">
      <h2>Effekt</h2>
      <div class="chips" id="fx"></div>
    </div>
    <div class="sec" id="sec-spd">
      <h2>Tempo <span id="spd-v">5</span></h2>
      <input type="range" id="spd" min="1" max="10" value="5" aria-label="Tempo">
    </div>
  <div id="s-licht"></div></main>
</section>
<section class="pg" id="g-heizung" hidden><section class="hero" id="h-heizung"></section><main class="sheet" id="s-heizung"></main></section>
<section class="pg" id="g-musik" hidden><section class="hero" id="h-musik"></section><main class="sheet" id="s-musik"></main></section>
<section class="pg" id="g-beschattung" hidden><section class="hero" id="h-beschattung"></section><main class="sheet" id="s-beschattung"></main></section>
<section class="pg" id="g-lueftung" hidden><section class="hero" id="h-lueftung"></section><main class="sheet" id="s-lueftung"></main></section>
<p class="foot">Demo-Werte. Echte Hardware ist nur beim Lichtband (Bluetooth) angebunden.</p>
</div>
<script>(()=>{
const N = 22;
const FX = [
  {id:'static', name:'Statisch', color:true, speed:false},
  {id:'rainbow', name:'Regenbogen', color:false, speed:true},
  {id:'breathe', name:'Atmen', color:true, speed:true},
  {id:'chase', name:'Lauflicht', color:true, speed:true},
  {id:'sparkle', name:'Funkeln', color:true, speed:true},
  {id:'fire', name:'Feuer', color:false, speed:true}
];
const SW = [
  ['Warmweiß',40,25],['Rot',0,100],['Orange',30,100],['Gelb',52,100],['Grün',130,100],
  ['Türkis',180,100],['Blau',225,100],['Violett',275,100],['Pink',320,100]
];
const st = {on:true, h:30, s:100, b:70, fx:'static', spd:5};
const $ = id => document.getElementById(id);
const root = document.documentElement;
const tube = $('tube'), leds = [];
for (let i = 0; i < N; i++) { const l = document.createElement('span'); tube.appendChild(l); leds.push(l); }

FX.forEach(f => {
  const b = document.createElement('button');
  b.textContent = f.name; b.dataset.id = f.id;
  b.onclick = () => { st.fx = f.id; sync(); };
  $('fx').appendChild(b);
});
SW.forEach(([n,h,s]) => {
  const b = document.createElement('button');
  b.title = n; b.setAttribute('aria-label', n);
  b.style.setProperty('--c', `hsl(${h} ${s}% ${s<50?85:55}%)`);
  b.dataset.h = h; b.dataset.s = s;
  b.onclick = () => { st.h = h; st.s = s; $('hue').value = h; sync(); };
  $('sw').appendChild(b);
});

$('hue').oninput = e => { st.h = +e.target.value; st.s = 100; sync(); };
$('bri').oninput = e => { st.b = +e.target.value; sync(); };
$('spd').oninput = e => { st.spd = +e.target.value; sync(); };
$('power').onclick = () => { st.on = !st.on; sync(); };

const SVC = 'a7c10001-5b1e-4f2a-9c3d-1e2f3a4b5c6d';
const CHR = 'a7c10002-5b1e-4f2a-9c3d-1e2f3a4b5c6d';
let dev = null, chr = null, busy = false, dirty = false;

const msg = t => { $('msg').textContent = t || ''; };
function setConn(state, label) {
  const c = $('conn');
  c.dataset.state = state;
  c.querySelector('span').textContent = label;
}

function packet() {
  // HSV (Wert 100 %) -> RGB; Helligkeit skaliert der Mikrocontroller
  const h = st.h / 60, sat = st.s / 100, c = sat, x = c * (1 - Math.abs(h % 2 - 1)), m = 1 - c;
  let r = 0, g = 0, b = 0;
  if (h < 1) [r, g, b] = [c, x, 0];
  else if (h < 2) [r, g, b] = [x, c, 0];
  else if (h < 3) [r, g, b] = [0, c, x];
  else if (h < 4) [r, g, b] = [0, x, c];
  else if (h < 5) [r, g, b] = [x, 0, c];
  else [r, g, b] = [c, 0, x];
  const to = v => Math.round((v + m) * 255);
  return new Uint8Array([
    st.on ? 1 : 0,
    FX.findIndex(f => f.id === st.fx),
    to(r), to(g), to(b),
    st.b, st.spd
  ]);
}

async function send() {
  if (!chr) return;
  if (busy) { dirty = true; return; }
  busy = true;
  try {
    do {
      dirty = false;
      const data = packet();
      if (chr.writeValueWithoutResponse) await chr.writeValueWithoutResponse(data);
      else await chr.writeValue(data);
    } while (dirty);
  } catch (e) {
    msg('Senden fehlgeschlagen: ' + e.message);
  }
  busy = false;
}

$('conn').onclick = async () => {
  if (dev && dev.gatt.connected) { dev.gatt.disconnect(); return; }
  if (!navigator.bluetooth) {
    msg('Dieser Browser unterstützt kein Web Bluetooth. Öffne die Seite in Chrome auf Android.');
    return;
  }
  msg('');
  setConn('busy', 'Suche …');
  try {
    dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    dev.addEventListener('gattserverdisconnected', () => { chr = null; setConn('off', 'Verbinden'); msg('Verbindung getrennt.'); });
    const server = await dev.gatt.connect();
    const service = await server.getPrimaryService(SVC);
    chr = await service.getCharacteristic(CHR);
    setConn('on', dev.name || 'XIAO-C6');
    send();
  } catch (e) {
    chr = null;
    setConn('off', 'Verbinden');
    msg(e.name === 'NotFoundError' ? 'Kein Gerät ausgewählt. Läuft der Sketch und ist das Board eingeschaltet?' : 'Verbindung fehlgeschlagen: ' + e.message);
  }
};

function colorName() {
  if (st.s < 50) return 'Warmweiß';
  const h = st.h;
  if (h < 15 || h >= 345) return 'Rot';
  if (h < 42) return 'Warmes Orange';
  if (h < 70) return 'Gelb';
  if (h < 165) return 'Grün';
  if (h < 200) return 'Türkis';
  if (h < 255) return 'Blau';
  if (h < 295) return 'Violett';
  return 'Pink';
}

function sync() {
  const f = FX.find(x => x.id === st.fx);
  root.style.setProperty('--h', st.h);
  root.style.setProperty('--s', st.s + '%');
  root.style.setProperty('--on', st.on ? 1 : 0);
  $('power').setAttribute('aria-pressed', st.on);
  $('fx-name').textContent = f.name;
  $('fx-sub').textContent = (f.color ? colorName() + ' · ' : '') + st.b + ' %';
  $('bri-v').textContent = st.b + ' %';
  $('spd-v').textContent = st.spd;
  $('sec-color').classList.toggle('dim', !f.color);
  $('sec-spd').classList.toggle('dim', !f.speed);
  document.querySelectorAll('#fx button').forEach(b => b.setAttribute('aria-pressed', b.dataset.id === st.fx));
  document.querySelectorAll('#sw button').forEach(b => b.setAttribute('aria-pressed', st.s === +b.dataset.s && st.h === +b.dataset.h));
  send();
}

const noise = (a, b) => { const x = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return x - Math.floor(x); };
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame(ms) {
  const t = ms / 1000, sp = (reduce ? 0.25 : 1) * st.spd / 5;
  const bf = st.b / 100;
  for (let i = 0; i < N; i++) {
    let h = st.h, s = st.s, k = 1;
    if (st.fx === 'rainbow') { h = (t * sp * 50 + i * 360 / N) % 360; s = 100; }
    else if (st.fx === 'breathe') { k = 0.12 + 0.88 * (0.5 + 0.5 * Math.sin(t * sp * 2.2)); }
    else if (st.fx === 'chase') {
      const p = (t * sp * 9) % N; let d = Math.abs(i - p); d = Math.min(d, N - d); k = Math.max(0.06, 1 - d / 5);
    }
    else if (st.fx === 'sparkle') { k = noise(i, Math.floor(t * sp * 4)) > 0.82 ? 1 : 0.1; }
    else if (st.fx === 'fire') {
      const v = 0.5 + 0.5 * Math.sin(t * sp * 6 + i * 1.7) * Math.sin(t * sp * 3.1 + i * 0.9);
      h = 6 + v * 36; s = 100; k = 0.3 + 0.7 * v;
    }
    const el = leds[i];
    if (!st.on) { el.style.background = '#3a3552'; el.style.boxShadow = 'none'; continue; }
    const l = (6 + bf * 52) * k + 3;
    el.style.background = `hsl(${h} ${s}% ${l}%)`;
    el.style.boxShadow = `0 0 ${6 + 12 * bf * k}px hsl(${h} ${s}% ${Math.min(l + 8, 70)}% / ${0.25 + 0.65 * k * bf})`;
  }
  requestAnimationFrame(frame);
}
sync();
requestAnimationFrame(frame);
})();</script>
<script>(()=>{
const $=id=>document.getElementById(id);
const root=document.documentElement,app=document.querySelector('.app');
const M={licht:{n:'Licht',c:'#f2b134'},heizung:{n:'Heizung',c:'#ef6a3a'},musik:{n:'Musik',c:'#8b6cf0'},beschattung:{n:'Beschattung',c:'#4f9ad6'},lueftung:{n:'Lüftung',c:'#2bb3a3'}};
const IC={licht:'M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z',heizung:'M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',musik:'M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',beschattung:'M4 4h16M6 4v10M18 4v10M6 8h12M6 11h12M4 14h16M12 14v6',lueftung:'M3 8h11a3 3 0 1 0-3-3M3 12h15a3 3 0 1 1-3 3M3 16h7a2.5 2.5 0 1 1-2.5 2.5'};
const svg=(p,f)=>`<svg viewBox="0 0 24 24" fill="${f?'currentColor':'none'}" stroke="${f?'none':'currentColor'}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${p}"/></svg>`;
const PW='M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0',PLAY='M8 5v14l11-7z',PAUSE='M7 5h3v14H7zM14 5h3v14h-3z',PREV='M6 5v14M19 5 9 12l10 7z',NEXT='M18 5v14M5 5l10 7-10 7z';

const HERO={
 heizung:()=>{
  const P=a=>[110+90*Math.cos(a),110-90*Math.sin(a)],an=v=>Math.PI*(1-(clamp(v,12,28)-12)/16);
  const [x,y]=P(an(S.ist)),[sx,sy]=P(an(S.soll));
  const mo=(HM.find(m=>m[0]===S.hMode)||[0,'Eigene Temperatur'])[1];
  return `<svg class="gz" viewBox="0 0 220 125" role="img" aria-label="Temperatur"><path d="M20 110A90 90 0 0 1 200 110" fill="none" style="stroke:var(--line)" stroke-width="14" stroke-linecap="round"/><path d="M20 110A90 90 0 0 1 ${x} ${y}" fill="none" style="stroke:hsl(var(--h) var(--s) 55%)" stroke-width="14" stroke-linecap="round"/><circle cx="${sx}" cy="${sy}" r="9" fill="#fff" style="stroke:var(--ink)" stroke-width="2.5"/><text x="110" y="92" text-anchor="middle" font-size="38" font-weight="800" fill="currentColor">${f1(S.ist)}°</text><text x="110" y="112" text-anchor="middle" font-size="12" style="fill:var(--mute)">Soll ${f1(S.soll)} °C</text></svg>`
   +st(S.hOn?'Heizung an':'Heizung aus',mo+(S.hPlan?' · Zeitplan aktiv':''),pb('hOn',1-S.hOn,!!S.hOn,PW,'Heizung ein/aus'));
 },
 musik:()=>{
  const [t,a]=SRC[S.src][S.trk];
  return `<div class="np"><div class="art"${S.mPlay?'':' data-p'}><i></i><i></i><i></i><i></i></div><div><b>${t}</b><small>${a} · ${SN[S.src]}</small></div></div><div class="bar"><i id="mp" style="width:${S.pos/S.len*100}%"></i></div><div class="tm2"><small id="mt">${tm(S.pos)} / ${tm(S.len)}</small></div><div class="tr"><button class="ib" data-act="prev" aria-label="Zurück">${svg(PREV)}</button>${pb('mPlay',1-S.mPlay,!!S.mPlay,S.mPlay?PAUSE:PLAY,'Wiedergabe')}<button class="ib" data-act="next" aria-label="Weiter">${svg(NEXT)}</button></div>`;
 },
 beschattung:()=>{
  const H=110*S.sh/100,hs=2+6*(1-S.ang/90);let sl='';
  for(let y=20;y<16+H;y+=8)sl+=`<rect x="34" y="${y}" width="132" height="${hs}" rx="1" fill="#7b8499"/>`;
  const cl=S.sh>50;
  return `<svg class="gz" viewBox="0 0 200 150" role="img" aria-label="Fenster"><rect x="30" y="10" width="140" height="130" rx="6" style="fill:hsl(205 70% 72% / .45);stroke:var(--line)" stroke-width="4"/><circle cx="148" cy="40" r="11" fill="#f2c14a"/><rect x="30" y="10" width="140" height="10" rx="4" fill="#7b8499"/>${sl}</svg>`
   +st(S.sh+' % geschlossen','Lamellen '+S.ang+'° · '+{manuell:'Manuell',sonne:'Sonnenschutz',zeit:'Zeitplan',hitze:'Hitzeschutz'}[S.sMode],pb('sh',cl?0:100,cl,cl?'M6 15l6-6 6 6':'M6 9l6 6 6-6','Rollo auf/zu'));
 },
 lueftung:()=>{
  const q=S.co<600?['Sehr gut',150]:S.co<800?['Gut',110]:S.co<1000?['Mäßig',45]:['Schlecht',5];
  const f=clamp((S.co-400)/1100,0,1),C=2*Math.PI*62;
  return `<svg class="gz" style="max-width:220px" viewBox="0 0 160 160" role="img" aria-label="CO2"><circle cx="80" cy="80" r="62" fill="none" style="stroke:var(--line)" stroke-width="12"/><circle cx="80" cy="80" r="62" fill="none" style="stroke:hsl(${q[1]} 70% 50%)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${f*C} ${C}" transform="rotate(-90 80 80)"/><text x="80" y="82" text-anchor="middle" font-size="32" font-weight="800" fill="currentColor">${Math.round(S.co)}</text><text x="80" y="102" text-anchor="middle" font-size="12" style="fill:var(--mute)">ppm CO₂ · ${q[0]}</text></svg>`
   +st('Stufe '+FANS[S.fan],'Luftfeuchte '+S.hum+' % · '+VM[S.vMode],pb('fan',S.fan?0:1,S.fan>0,PW,'Lüftung ein/aus'));
 }
};

// ================= Spotify (Fernbedienung per Web API, PKCE) =================
const RURI=location.origin+location.pathname;
const SP={cid:localStorage.getItem('sp_cid')||'',tok:JSON.parse(localStorage.getItem('sp_tok')||'null'),dev:[],pl:[],pst:null,err:'',perr:'',sig:'',p0:0,t0:0,last:null};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const spPos=()=>SP.pst&&SP.pst.item?clamp(SP.p0+(SP.pst.is_playing?Date.now()-SP.t0:0),0,SP.pst.item.duration_ms):0;

async function login(){
  if(!SP.cid){SP.err='Bitte zuerst die Client-ID eintragen.';rend();return}
  const v=b64(crypto.getRandomValues(new Uint8Array(48)));
  localStorage.setItem('sp_v',v);
  const ch=b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({response_type:'code',client_id:SP.cid,scope:'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private',redirect_uri:RURI,code_challenge_method:'S256',code_challenge:ch});
}
async function tokenReq(p){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(Object.assign({client_id:SP.cid},p))});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error_description||j.error||r.status);
  SP.tok={a:j.access_token,r:j.refresh_token||(SP.tok&&SP.tok.r),e:Date.now()+j.expires_in*1000-60000};
  localStorage.setItem('sp_tok',JSON.stringify(SP.tok));
}
async function token(){
  if(!SP.tok)return null;
  if(Date.now()>SP.tok.e)await tokenReq({grant_type:'refresh_token',refresh_token:SP.tok.r});
  return SP.tok.a;
}
async function api(path,method,body){
  const t=await token();if(!t)return {};
  const h={Authorization:'Bearer '+t};if(body)h['Content-Type']='application/json';
  const r=await fetch('https://api.spotify.com/v1'+path,{method:method||'GET',headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===204||r.status===202)return {};
  if(r.status===404)return {noDevice:1};
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error((j.error&&j.error.message)||('Fehler '+r.status));
  return j;
}
async function spRun(f,after){
  try{const r=await f();SP.err=r&&r.noDevice?'Kein aktives Gerät. Öffne die Spotify-App auf dem Handy und starte kurz einen Song.':''}
  catch(e){SP.err=e.message}
  setTimeout(poll,after||600);
}
async function poll(){
  if(!SP.tok||pg!=='musik')return;
  const idle=document.activeElement&&document.activeElement.type==='range';
  try{
    const [s,d]=await Promise.all([api('/me/player'),api('/me/player/devices')]);
    SP.pst=s&&s.item?s:null;SP.dev=(d&&d.devices)||[];SP.perr='';
    if(SP.pst){SP.p0=s.progress_ms;SP.t0=Date.now()}
    const act=SP.dev.find(x=>x.is_active);
    if(act&&act.volume_percent!=null&&!idle)S.vol=act.volume_percent;
    if(!SP.plTried){SP.plTried=1;api('/me/playlists?limit=12').then(j=>{SP.pl=(j.items||[]).filter(Boolean);if(pg==='musik')rend()}).catch(()=>{})}
  }catch(e){SP.perr=e.message}
  const sig=JSON.stringify([SP.pst&&SP.pst.item.id,SP.pst&&SP.pst.is_playing,SP.dev.map(x=>x.id+x.is_active),SP.err,SP.perr,S.vol]);
  if(sig!==SP.sig&&!idle){SP.sig=sig;rend()}
}

HERO.musik=()=>{
  const s=SP.pst,it=s&&s.item,ok=!!SP.tok,pl=!!(s&&s.is_playing),dis=ok?'':' disabled';
  const t=it?it.name:ok?'Nichts aktiv':'Spotify';
  const a=it?it.artists.map(x=>x.name).join(', ')+(s.device?' · '+s.device.name:''):ok?'Starte Spotify auf dem Handy':'Nicht verbunden';
  const img=it&&it.album.images[1]||it&&it.album.images[0];
  const len=it?it.duration_ms/1000:1,pos=it?spPos()/1000:0;
  return `<div class="np"><div class="art${img?' img':''}"${pl?'':' data-p'}${img?` style="background-image:url(${esc(img.url)})"`:''}>${img?'':'<i></i><i></i><i></i><i></i>'}</div><div><b>${esc(t)}</b><small>${esc(a)}</small></div></div><div class="bar"><i id="mp" style="width:${pos/len*100}%"></i></div><div class="tm2"><small id="mt">${tm(pos)} / ${tm(len)}</small></div><div class="tr"><button class="ib" data-act="spprev" aria-label="Zurück"${dis}>${svg(PREV)}</button><button class="power" aria-pressed="${pl}" data-act="sptoggle" aria-label="Wiedergabe"${dis}>${svg(pl?PAUSE:PLAY,1)}</button><button class="ib" data-act="spnext" aria-label="Weiter"${dis}>${svg(NEXT)}</button></div>`;
};

  return er+slider('Lautstärke','vol',0,100,1)
   +`<div class="sec"><h2>Ausgabegerät</h2>${SP.dev.length?`<div class="chips">${SP.dev.map(d=>`<button data-act="spdev" data-id="${esc(d.id)}" aria-pressed="${d.is_active}">${esc(d.name)}</button>`).join('')}</div>`:''}<p class="hint">${SP.dev.length?'':'Kein Gerät gefunden. '}Öffne die Spotify-App auf dem Handy. Einen Bluetooth-Lautsprecher koppelst du in den Handy-Einstellungen, Spotify spielt dann automatisch darüber.</p></div>`
   +(SP.pl.length?`<div class="sec"><h2>Playlists</h2><div class="chips">${SP.pl.map(p=>`<button data-act="sppl" data-id="${esc(p.uri)}">${esc(p.name)}</button>`).join('')}</div></div>`:'')
   +chips('Schlaf-Timer','sleep',[[0,'Aus'],[15,'15 min'],[30,'30 min'],[60,'60 min']])
   +`<div class="sec"><div class="chips"><button data-act="spout">Spotify trennen</button></div></div>`;
};

ACT.splogin=()=>{login()};
ACT.spout=()=>{localStorage.removeItem('sp_tok');SP.tok=null;SP.pst=null;SP.dev=[];SP.pl=[];SP.plTried=0;SP.err=''};

  const pl=SP.pst&&SP.pst.is_playing;

setInterval(()=>{
  if(pg!=='musik'||!SP.pst||!SP.pst.item)return;
  const m=$('mp');if(!m)return;
  const p=spPos();m.style.width=p/SP.pst.item.duration_ms*100+'%';
  $('mt').textContent=tm(p/1000)+' / '+tm(SP.pst.item.duration_ms/1000);
},1000);

async function init(){
  const q=new URLSearchParams(location.search);
  if(q.get('code')&&localStorage.getItem('sp_v')){
    try{await tokenReq({grant_type:'authorization_code',code:q.get('code'),redirect_uri:RURI,code_verifier:localStorage.getItem('sp_v')})}
    catch(e){SP.err='Anmeldung fehlgeschlagen: '+e.message}
    localStorage.removeItem('sp_v');
    history.replaceState(null,'',RURI+'#musik');
  }else if(q.get('error')){
    SP.err='Spotify: '+q.get('error');
    history.replaceState(null,'',RURI+'#musik');
  }
  route();poll();
}
init();
})();</script>
